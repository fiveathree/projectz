<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>澳汐七日 · TYPHOON DEAD</title>
    <meta name="description" content="颱風夜，亞洲舊城爆發潮病。生存七日，趕上第七日 18:00 碼頭最後一班撤離船。" />
    <meta name="theme-color" content="#07090d" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./favicon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="澳汐七日 · TYPHOON DEAD" />
    <meta property="og:description" content="颱風夜，亞洲舊城爆發潮病。生存七日，趕上最後一班撤離船。" />
    <meta property="og:image" content="https://typhoon-dead.fiveathree.workers.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://typhoon-dead.fiveathree.workers.dev/og.png" />
  </head>
  <body>
    <div id="game"></div>
    <div id="hud" class="hidden">
      <div id="clock"></div>
      <div id="bars"></div>
      <div id="topbtns">
        <button data-act="sneak" title="潛行（C）">🥷</button>
        <button data-act="flash" title="電筒（F）">🔦</button>
        <button data-act="inv" title="背包（Tab）">🎒</button>
        <button data-act="phone" title="手機（P / M）">📱</button>
        <button data-act="pause" title="暫停（Esc）">⏸</button>
      </div>
    </div>
    <div id="status" class="hidden"></div>
    <div id="prompt" class="hidden"></div>
    <div id="progress" class="hidden"><div></div></div>
    <div id="hotbar" class="hidden"></div>
    <div id="toast"></div>
    <div id="sleep" class="screen hidden">瞓緊覺…<small>有喪屍接近會嘈醒你</small></div>
    <div id="inv" class="panel hidden"></div>
    <div id="phone" class="panel hidden">
      <div class="ph-top"><span id="ph-clock"></span><span id="ph-batt"></span></div>
      <div class="ph-body">
        <div data-tab="map"><canvas></canvas><p>黃 = 撤離點 / 出入口 · 青 = 你 · 綠 = 倖存者 · 紅 = 屍體 · 紫 = 凍倉</p></div>
        <div data-tab="notes"></div>
        <div data-tab="radio"></div>
        <div data-tab="skills"></div>
        <div class="ph-dead hidden">📵 手機冇電<br /><small>用尿袋叉電</small></div>
      </div>
      <div class="ph-tabs">
        <button data-t="map">地圖</button><button data-t="notes">筆記</button><button data-t="radio">電台</button><button data-t="skills">技能</button>
      </div>
    </div>
    <div id="touch" class="hidden">
      <div id="stick"><div></div></div>
      <button id="t-attack">攻擊</button>
      <button id="t-shove">推</button>
      <button id="t-use" class="hidden">互動</button>
      <button id="t-act2" class="hidden">釘板</button>
      <button id="t-throw" class="hidden">掟</button>
    </div>
    <div id="daycard" class="screen hidden"></div>
    <div id="menu" class="screen"></div>
    <div id="rotate" class="screen">請將手機打橫</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
